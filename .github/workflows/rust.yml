name: Проверки Rust

on:
  push:
    branches:
      - main
      - foundation/**
      - implementation/**
  pull_request:
    branches:
      - main
      - foundation/**

permissions:
  contents: read

jobs:
  rust:
    name: Форматирование, Clippy и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить стабильный Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Запустить тесты
        run: cargo test --locked --all-targets --all-features
      - name: Проверить источники и лицензии зависимостей
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          jq -r '.packages[] | select(.source != null) | [.name, .version, (.license // "MISSING"), .source] | @tsv' "$RUNNER_TEMP/cargo-metadata.json"
          jq -e '
            [.packages[] | select(.source != null)] as $packages
            | ($packages | length > 0)
            and all($packages[];
              .source == "registry+https://github.com/rust-lang/crates.io-index"
              and (.license != null)
              and (
                .license
                | if . == "MIT/Apache-2.0" or . == "Apache-2.0/MIT" then "MIT OR Apache-2.0" else . end
                | split(" OR ")
                | all(.[]; . == "MIT" or . == "Apache-2.0" or . == "BSD-3-Clause")
              )
            )
          ' "$RUNNER_TEMP/cargo-metadata.json" > /dev/null
